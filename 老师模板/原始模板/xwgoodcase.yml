name: "初赛 Good Case 提交"
description: "提交一条初赛 Good Case（小微超预期把事件办好），按规范填写全部必填内容；请勿用本模板提交 Bad Case"
title: "Good Case"
labels:
  - "good-case"
  - "待评审"
body:
  - type: markdown
    attributes:
      value: |
        提交须知：
        1. 一个 issue 只提交 **一条** Good Case，普通的一问一答即使答得好也不计入加分。 请勿修改issue的标题内容。
        2. 请在下方「亮点总结」填写一句话结论，例如：`小工具创建/主入口一次生成可反复修改的旅行记账工具`；
        3. **完整会话截图是主要证据**，需覆盖从第一轮到最后一轮的全程；涉及图片、文件结果的，请在「附件」中补充产物；
        4. Good Case 是纯加分项，不提交不扣分。被确认的优质 Good Case计 2 分，最多计 5 条、总加分封顶 10 分；
        5. Good Case 在精不在多，每人赛会只取最后的 10 条 Good Case 数据进行评比，请不要重复提交或者进行低质量提交；

  - type: input
    id: highlight_summary
    attributes:
      label: "亮点总结"
      description: "用一句话概括小微办成了什么及其亮点，供审核、查重和复核快速定位"
      placeholder: "例如：小工具创建/主入口一次生成可反复修改的旅行记账工具"
    validations:
      required: true

  - type: dropdown
    id: entry_path
    attributes:
      label: "① 入口路径"
      description: "选择本次会话是从哪个入口进入触发的；不在上面列举的，请选「其他入口」并在下方补充说明"
      options:
        - "主入口对话（直接聊天、提需求）"
        - "扫一扫（扫码/拍图后进入）"
        - "聊天内「问小微」（选中聊天内容询问）"
        - "搜索入口（微信搜索栏唤起）"
        - "朋友圈入口（在朋友圈内容上问）"
        - "公众号内（在文章上问）"
        - "视频号内（在视频内容上问）"
        - "文件内（在文档上问）"
        - "听一听（听一听歌单触发）"
        - "其他入口（请在下方补充说明）"
    validations:
      required: true

  - type: input
    id: entry_path_detail
    attributes:
      label: "其他入口路径补充说明（选填）"
      description: "不在上面列举的入口路径，请在此处补充说明"
      placeholder: "不属于上述 9 类入口的，请补充说明是哪个入口、如何触发"
    validations:
      required: false

  - type: textarea
    id: full_conversation_screenshot
    attributes:
      label: "② 完整会话截图"
      description: "请直接将截图拖拽或粘贴到本输入框中，需覆盖从第一轮到最后一轮的全程；若确有特殊情况无法提供截图，请说明原因并尽量补充文字记录"
      placeholder: |
        请按「第几轮 / 用户说了什么 / 小微回复了什么(附截图)」的顺序整理，例如：

        第一轮：
        附对应截图，截图中有完整的用户问题和小微完整内容

        第二轮：
        附对应截图，截图中有完整的用户问题和小微完整内容

        第三轮：
        附对应截图，截图中有完整的用户问题和小微完整内容
    validations:
      required: true

  - type: input
    id: turns
    attributes:
      label: "会话轮数"
      description: "本次会话一共几轮。「用户提问 + 小微回复」记为 1 轮，请填写数字"
      placeholder: "例如：6"
    validations:
      required: true

  - type: textarea
    id: true_expectation
    attributes:
      label: "③ 任务预期"
      description: "你原本想让小微帮你做的这件事是什么？请描述清楚任务本身，而不是只说「帮我写个东西」"
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: "④ 实际结果"
      description: "它实际做到了什么？请客观描述最终产出（生成了什么文件/工具、做了什么操作、回了什么话），不要在此处做评价"
      placeholder: |
        例如：一次生成了带分类与预算上限的记账小工具，后续两次修改只改了指定字段，未破坏已有数据
    validations:
      required: true

  - type: textarea
    id: highlight_analysis
    attributes:
      label: "⑤ 难点是什么"
      description: "说明这件事难在哪：需要多步规划、约束保持、跨轮记忆、专业领域知识，还是别的。要回答的是「为什么换个人/换个助手来做未必能一次办成」"
      placeholder: |
        难点：（需要同时满足 XX 与 YY 约束，中途还要改 ZZ，一般助手会在第 3 轮丢掉 XX）
    validations:
      required: true

  - type: textarea
    id: completion_process
    attributes:
      label: "⑥ 如何完成的"
      description: "说明小微是怎么一步步做到的：关键步骤有哪些、哪些容易出错的细节它做对了、约束是否全程保住、状态是否可见。下方两个下拉选项用于规范标注亮点类型与所属场景，请配合选择。"
      placeholder: |
        关键步骤：（第 1 轮…第 2 轮…第 N 轮…）
        做对的细节：（容易出错但没出错的地方）
    validations:
      required: true

  - type: dropdown
    id: highlight_category
    attributes:
      label: "亮点类型"
      description: "选择本案例最贴近的亮点类型，便于规范统计；若不确定可选「其他」并在⑤⑥中说明"
      options:
        - "多轮记忆准确"
        - "复杂任务一次性完成"
        - "跨场景/多入口串联完成任务"
        - "情绪共情到位"
        - "幽默风趣/人设突出"
        - "内容详实且精炼"
        - "场景识别/意图理解精准"
        - "主动关怀/超出预期"
        - "小工具创建等独有能力"
        - "其他"
    validations:
      required: true

  - type: dropdown
    id: skill_scene
    attributes:
      label: "所属场景"
      description: "选择最贴近的一组；Good Case 的场景信息用于加分案例和作品集分析。"
      options:
        - "A 对话与内容创作类"
        - "B 微信生态操作类"
        - "C 图片与多模态类"
        - "D 搜索与信息获取类"
        - "E 效率与生活服务类"
        - "F 小工具创建类"
    validations:
      required: true

  - type: dropdown
    id: satisfaction_grade
    attributes:
      label: "⑦ 满意度等级"
      description: |
        A|B 的分界线是「有没有小瑕疵」：过程中是否出现过纠错、重述需求、多等一轮、边缘需求没照顾到。
        注意：本模板只有 A/B 两档——若你认为它没办好（C/D 档），请改用 Bad Case 模板提交。
      options:
        - "A 非常满意（任务一次完成、关键要求保持、过程与结果清晰）"
        - "B 基本满意（核心任务完成，存在可接受的小瑕疵或纠错后完成）"
    validations:
      required: true

  - type: textarea
    id: grade_basis
    attributes:
      label: "满意度判定依据"
      description: "简述为什么判这个等级：哪些约束被完整保住、状态是否可见、有没有走过弯路"
      placeholder: |
        例如：三次修改均只改动指定字段，未破坏其余数据，全程有进度提示，一次到位，判 A
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "⑧ 可复现性"
      description: "同样的任务，重复测试时小微依然能一次办好的概率；仅偶发办好一次的价值远低于稳定复现。"
      options:
        - "每次都能一次办成"
        - "高概率一次办成（约50%以上）"
        - "偶发一次办成（低于50%）"
        - "仅成功过一次，未再重试"
    validations:
      required: true

  - type: input
    id: reproduction_test_count
    attributes:
      label: "测试次数"
      description: "用相同或等价的任务一共测试了几次，请填写数字；仅测试过一次填 1"
      placeholder: "例如：5"
    validations:
      required: true

  - type: input
    id: reproduction_success_count
    attributes:
      label: "一次办成的次数"
      description: "上述测试次数中，有几次小微依然能一次办好这件事，请填写数字"
      placeholder: "例如：4"
    validations:
      required: true

  - type: dropdown
    id: env_client_platform
    attributes:
      label: "客户端平台"
      description: "测试所用的手机系统，点选即可"
      options:
        - "iOS"
        - "Android"
        - "鸿蒙"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: "附件"
      description: "涉及图片理解、文件处理等带附近案例，请在此补充必要的原始输入文件、生成产物截图或工具结果截图，便于复核。"
    validations:
      required: false

  - type: textarea
    id: trigger_condition
    attributes:
      label: "触发条件说明（选填）"
      description: "若复现需要特定前置条件（如特定人设、特定前几轮铺垫等），请在此说明；不确定可留空"
      placeholder: |
        触发条件：（如特定人设、特定前几轮铺垫等，不确定可留空）
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: "提交确认"
      description: "请逐项确认后再提交"
      options:
        - label: "我确认本次提交为 Good Case，未用本模板提交 Bad Case"
          required: true
        - label: "我确认这件事具有一定复杂度/新颖性，并非普通的一问一答"
          required: true
        - label: "我确认以上内容为真实复现结果，未编造或篡改对话内容"
          required: true
        - label: "我已确认本 issue 仅包含一条 Good Case，未与其他案例合并提交"
          required: true
        - label: "我知悉并同意本次提交内容可用于比赛评测数据集"
          required: true
